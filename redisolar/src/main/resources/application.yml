spring:
  application:
    name: RediSolar
  web:
    resources:
      # The pre-built Vue dashboard is served from the root of the app.
      static-locations: classpath:/dashboard/dist/

server:
  port: 8081

management:
  server:
    port: 8084
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.redislabs.university: DEBUG

redis:
  host: localhost
  port: 6379
  password:

redisolar:
  # Which SiteDao/controller to use: "basic" or "geo" (geospatial lessons).
  site-dao: basic
  # Which MetricDao to use: "zset" (sorted sets) or "timeseries" (RedisTimeSeries).
  metric-dao: zset
